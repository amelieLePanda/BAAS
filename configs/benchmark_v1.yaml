# BAAS Benchmark v1 - single source of truth for all experiments.
# Load with: yaml.safe_load(Path("configs/benchmark_v1.yaml").read_text())
# This file is embedded verbatim in every output JSON for reproducibility.

env:
  env_id: "highway-v0"
  policy_frequency: 2          # Hz - must match ego training frequency
  simulation_frequency: 15     # Hz - physics steps per second
  horizon_steps: 240           # policy steps = 120 s at policy_frequency=2
  background_traffic: 6
  vehicles_density: 1.0

rollouts:
  k: 30
  base_seed: 0
  env_seed_mode: "jitter"      # "jitter" or "fixed"
  salt: 0

perturbation:
  ego_dy_eps: 0.5              # metres
  ego_dv_eps: 1.0              # m/s
  adv_dy_eps: 0.5
  adv_dv_eps: 1.0

incident:
  critical_dist: 6.0           # metres - hard proximity gate
  nuisance_dist: 12.0          # metres - nuisance crash threshold
  ttc_crit_s: 1.5              # seconds - TTC threshold for critical incident
  dx_near_m: 5.0
  dy_near_m: 1.0
  v_stop_mps: 1.0
  stop_streak_steps: 5
  hard_brake_a: -4.0           # m/s²

feasibility:
  n_feasibility_reruns: 10     # reruns per scenario to estimate feasibility

ego_training:
  # DQN hyperparameters - proven settings for CNN ego on highway-env
  learning_rate: 0.0005        # constant (no decay)
  buffer_size: 15000
  learning_starts: 200
  batch_size: 32
  gamma: 0.8                   # short-horizon discounting works better here
  train_freq: 1
  gradient_steps: 1
  target_update_interval: 50
  exploration_fraction: 0.7
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.01  # tighter final policy vs. 0.05 demo default
  # Reward shaping - designed for safe + fast driving
  collision_reward: -3.0
  lane_change_reward: -0.1
  high_speed_reward: 0.1
  right_lane_reward: 0.1

diversity:
  dist_bins: 10
  ttci_bins: 10
  dist_max: 60.0               # metres - max dist for φ-space grid
  frechet_downsample_to: 30    # trajectory length for Fréchet computation

map_elites:
  n_adversaries: 1
  n_iterations: 10000
  batch_size: 30
  n_blocks: 20
  block_size: 3
  initial_population: 100
  sigma0: 1.0                  # CMA-ME initial step size
  snapshot_every: 500          # save archive snapshot every N iterations (0 = disabled)

cma_es:
  n_adversaries: 1
  popsize: 20
  sigma0: 0.5
  n_generations: 200

ppo_adversary:
  n_adversaries: 1
  total_timesteps: 1000000
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  n_steps: 2048
  batch_size: 64
  ent_coef: 0.01
  clip_range: 0.2
  min_ttf_steps: 10            # early-collision down-weighting threshold (t_min)
  w_proximity: 0.05            # weight on proximity shaping ψ(d)
  c_time_step: 0.001           # per-step time cost
  r_critical: 1.5              # terminal reward on first critical incident
  r_adv_crash_close: -1.0      # penalty when adversary crashes near ego
  r_adv_crash_nuisance: -6.0   # penalty when adversary crashes far from ego

novelty_search:
  n_adversaries: 1
  pop_size: 50
  n_generations: 200
  k_nearest: 10
  archive_prob: 0.2

qdrl:
  n_adversaries: 1
  n_iters: 80
  n_emitters: 4
  emitter_batch_size: 4
  sigma0: 0.8
  snapshot_every: 5
  archive_grid_dims: [10, 10]
  dist_range: [0.0, 50.0]
  burst_steps: 25000
  n_envs: 4
  eval_rollouts: 6
  r_critical_range: [1.0, 2.0]
  r_adv_close_range: [-2.0, -0.2]
  r_adv_nuis_range: [-10.0, -2.0]
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  ppo_n_steps: 1024
  ppo_batch_size: 256
  ent_coef: 0.02
  clip_range: 0.2
  device: "auto"

